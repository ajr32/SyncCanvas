name: Python checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m ruff check synccanvas/seed_demo.py synccanvas/tests/test_seed_demo.py
      - run: python -m ruff format --diff synccanvas/seed_demo.py synccanvas/tests/test_seed_demo.py
      - run: python -m mypy synccanvas/seed_demo.py --follow-imports=skip
      - run: python -m pytest -q
