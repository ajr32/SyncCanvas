[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synccanvas"
version = "0.1.0"
description = "Family homework planner (local development prototype)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dev = ["ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["synccanvas*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
